name: Build Patch

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and validate Morphe patch bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build bundle and run Morphe patch discovery
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:generatePatchesList --no-daemon

      - name: Validate discovered patch list
        run: |
          test -s patches-list.json
          jq -e '.patches | type == "array" and length > 0' patches-list.json
          jq -e '.patches | any(.name == "Gboard Font Hook Probe (Experimental)")' patches-list.json
          echo "Morphe discovery found the expected experimental probe patch."

      - name: Stage installable bundle only
        run: |
          mkdir -p dist
          cp patches/build/libs/patches-*.mpp dist/
          rm -f dist/*-sources.mpp dist/*-javadoc.mpp
          test "$(find dist -maxdepth 1 -type f -name '*.mpp' | wc -l)" -eq 1
          cp patches-list.json dist/

      - name: Upload installable bundle and discovery report
        uses: actions/upload-artifact@v4
        with:
          name: gboard-font-studio-install
          path: dist/*
          if-no-files-found: error
          retention-days: 14
